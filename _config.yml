collections:
  updates:
    output: true
    permalink: /updates/:slug/
  wiki:
    output: true
    permalink: /wiki/:path/
  tutorials:
    output: true
    permalink: /tutorials/:path/
  tutorials_de:
    output: true
    permalink: /de/tutorials/:path/
  redirects:
    output: true
    permalink: /:path/

defaults:
- scope:
    path: ""
    type: pages
  values:
    layout: default
    author: Alexander01998
- scope:
    path: ""
    type: updates
  values:
    layout: update
- scope:
    path: ""
    type: wiki
  values:
    layout: wiki
    secondarytitle: Wurst Wiki
- scope:
    path: ""
    type: tutorials
  values:
    layout: tutorial
- scope:
    path: ""
    type: redirects
  values:
    layout: redirect

