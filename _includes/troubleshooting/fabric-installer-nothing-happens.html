<details>
	<summary id="fabric-installer-nothing-happens">When I try to run the Fabric installer, nothing happens.</summary>
	<p>
		This can happen when you don't have Java installed. You can download Java from <a href="https://adoptium.net/temurin" target="_blank" rel="nofollow">Adoptium</a>. The page should automatically show the right version for your operating system, but if not, look for a version that says "JDK 21 - LTS".
	</p>
</details>
