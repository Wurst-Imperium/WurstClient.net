name: Announce Wurst Update
run-name: Announce Wurst ${{ inputs.wurst_version }} update on WurstForum

on:
  workflow_dispatch:
    inputs:
      wurst_version:
        description: "Wurst version (without v or -MC)"
        required: true
      dry_run:
        description: "Don't actually upload the announcement"
        type: boolean
        default: false
      distinct_id:
        required: false

permissions:
  # To push the automated commit.
  contents: write
  # To trigger the Jekyll workflow.
  actions: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ inputs.distinct_id }}
      run: echo ${{ inputs.distinct_id }}

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: _scripts/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r _scripts/requirements.txt

    - name: Run announce_wurst_update.py
      id: announce
      env:
        WURSTFORUM_TOKEN: ${{ secrets.WF_BOT_TOKEN }}
      run: |
        python _scripts/announce_wurst_update.py \
          "${{ inputs.wurst_version }}" \
          ${{ inputs.dry_run && '--dry-run' || '' }}

    - name: Commit changes
      if: ${{ !inputs.dry_run }}
      run: |
        WURST_VERSION=${{ inputs.wurst_version }}
        DISCUSSION_ID=${{ steps.announce.outputs.discussion_id }}
        git config --local user.email "contact.wurstimperium@gmail.com"
        git config --local user.name "Wurst-Bot"
        git add .
        git commit -m "[Wurst-Bot] Link Wurst $WURST_VERSION post to WF thread $DISCUSSION_ID"
        git push

    - name: Trigger Jekyll workflow
      if: ${{ !inputs.dry_run }}
      id: jekyll_dispatch
      uses: Wurst-Imperium/dispatch-and-wait@v1
      with:
        token: ${{ github.token }}
        owner: Wurst-Imperium
        repo: WurstClient.net
        ref: gh-pages
        workflow: jekyll.yml
        run_timeout_seconds: 300  # 5 minutes
