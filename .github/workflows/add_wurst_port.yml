# Adds the necessary Jekyll metadata when an existing Wurst Client update is ported to a new Minecraft version.
name: Add Wurst Port
run-name: Add Wurst ${{ github.event.inputs.wurst_version }} build for ${{ github.event.inputs.mc_version }}

on:
  workflow_dispatch:
    inputs:
      wurst_version:
        description: "Wurst version (without v or -MC)"
        required: true
      mc_version:
        description: "Minecraft version"
        required: true
      fapi_version:
        description: "Fabric API version"
        required: true
      distinct_id:
        description: "Automatically set by the return-dispatch action (leave blank if running manually)"
        required: false

permissions:
  # To push the automated commit.
  contents: write
  # To trigger the Jekyll workflow.
  actions: write

jobs:
  update_post:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ github.event.inputs.distinct_id }}
      run: echo ${{ github.event.inputs.distinct_id }}

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: _scripts/requirements.txt

    - name: Install dependencies
      run: pip install -r _scripts/requirements.txt

    - name: Run add_wurst_port.py
      run: |
        python _scripts/add_wurst_port.py \
          "${{ github.event.inputs.wurst_version }}" \
          "${{ github.event.inputs.mc_version }}" \
          "${{ github.event.inputs.fapi_version }}"

    - name: Commit changes
      run: |
        WURST_VERSION=${{ github.event.inputs.wurst_version }}
        MC_VERSION=${{ github.event.inputs.mc_version }}
        git config --local user.email "contact.wurstimperium@gmail.com"
        git config --local user.name "Wurst-Bot"
        git add .
        git commit -m "[Wurst-Bot] Port Wurst $WURST_VERSION to Minecraft $MC_VERSION"
        git push

    - name: Trigger Jekyll workflow
      id: jekyll_dispatch
      uses: codex-/return-dispatch@v2
      with:
        token: ${{ github.token }}
        owner: Wurst-Imperium
        repo: WurstClient.net
        ref: gh-pages
        workflow: jekyll.yml

    - name: Wait for Jekyll workflow to finish (run ${{ steps.jekyll_dispatch.outputs.run_id }})
      uses: codex-/await-remote-run@v1
      with:
        token: ${{ github.token }}
        owner: Wurst-Imperium
        repo: WurstClient.net
        run_id: ${{ steps.jekyll_dispatch.outputs.run_id }}
        run_timeout_seconds: 300  # 5 minutes
