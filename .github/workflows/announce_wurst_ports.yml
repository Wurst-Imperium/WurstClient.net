name: Announce Wurst Ports
run-name: Announce new Wurst ${{ github.event.inputs.wurst_version }} port(s) on WurstForum

on:
  workflow_dispatch:
    inputs:
      wurst_version:
        description: "Wurst version (without v or -MC)"
        required: true
      branches:
        description: "Space-separated list of branch names (e.g. 'master 1.21.3')"
        required: true
      dry_run:
        description: "Don't actually upload the announcement"
        type: boolean
        default: false
      distinct_id:
        description: "Automatically set by the return-dispatch action (leave blank if running manually)"
        required: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ github.event.inputs.distinct_id }}
      run: echo ${{ github.event.inputs.distinct_id }}

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: _scripts/requirements.txt

    - name: Install dependencies
      run: pip install -r _scripts/requirements.txt

    - name: Run announce_wurst_ports.py
      env:
        WURSTFORUM_TOKEN: ${{ secrets.WF_BOT_TOKEN }}
      run: |
        python _scripts/announce_wurst_ports.py \
          "${{ github.event.inputs.wurst_version }}" \
          ${{ github.event.inputs.branches }} \
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
